name: 🐧 Linux Builds
on:
  workflow_call:
    inputs:
      changed-files:
        description: A list of changed files, pre-filtered for parsing by clangd-tidy.
        required: true
        type: string
      templates:
        description: Also build export templates (release CI). PR CI builds the editor only.
        required: false
        default: false
        type: boolean
    secrets:
      STEAMWORKS_SDK_URL:
        description: Private URL of the Steamworks SDK zip (redistributable binaries must not be committed).
        required: false
  workflow_dispatch:

# Global Settings
env:
  SCONS_FLAGS: >-
    dev_mode=yes
    module_text_server_fb_enabled=yes
  GODOT_CPP_BRANCH: 4.5
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  ASAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/asan.txt
  LSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/lsan.txt
  TSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/tsan.txt
  UBSAN_OPTIONS: color=always:print_suppressions=1:suppressions=${{ github.workspace }}/misc/error_suppressions/ubsan.txt

jobs:
  build-linux-editor:
    # Stay one LTS before latest to increase portability of Linux artifacts.
    runs-on: ubuntu-22.04
    name: Editor w/ Mono (Crete, target=editor)
    timeout-minutes: 150
    env:
      CRETE_FLAGS: >-
        module_mono_enabled=yes
        module_gdscript_enabled=no
        module_openxr_enabled=no
        tests=yes
        compiledb=yes
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: linux-editor-mono
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Force remove preinstalled .NET SDKs
        run: |
          sudo rm -rf /usr/share/dotnet/sdk/*

      - name: Setup older .NET SDK as baseline
        uses: actions/setup-dotnet@v5
        with:
          # Targeting the oldest version we want to support to ensure it still builds.
          dotnet-version: 8.0.100

      - name: Steamworks SDK (optional)
        id: steam
        shell: bash
        env:
          STEAMWORKS_SDK_URL: ${{ secrets.STEAMWORKS_SDK_URL }}
        run: |
          if [ -n "$STEAMWORKS_SDK_URL" ]; then
            echo "Downloading Steamworks SDK..."
            curl -fsSL "$STEAMWORKS_SDK_URL" -o /tmp/steamworks_sdk.zip
            rm -rf /tmp/steamworks_sdk && mkdir -p /tmp/steamworks_sdk
            unzip -q /tmp/steamworks_sdk.zip -d /tmp/steamworks_sdk
            rm -rf modules/godotsteam/sdk && mkdir -p modules/godotsteam/sdk
            if [ -d /tmp/steamworks_sdk/public ]; then
              mv /tmp/steamworks_sdk/* modules/godotsteam/sdk/
            else
              mv /tmp/steamworks_sdk/*/* modules/godotsteam/sdk/
            fi
            ls modules/godotsteam/sdk/
            echo "steam-flags=module_godotsteam_enabled=yes module_crete_steam_stub_enabled=no" >> "$GITHUB_OUTPUT"
          else
            echo "No STEAMWORKS_SDK_URL secret; building with the Crete Steam stub."
            echo "steam-flags=module_godotsteam_enabled=no module_crete_steam_stub_enabled=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Download pre-built AccessKit
        shell: sh
        id: accesskit-sdk
        run: |
          if python ./misc/scripts/install_accesskit.py; then
            echo "ACCESSKIT_ENABLED=yes" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::AccessKit SDK installation failed, building without AccessKit support."
            echo "ACCESSKIT_ENABLED=no" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ env.CRETE_FLAGS }} ${{ steps.steam.outputs.steam-flags }} accesskit=${{ steps.accesskit-sdk.outputs.ACCESSKIT_ENABLED }}
          platform: linuxbsd
          target: editor

      - name: Style checks via clangd-tidy
        if: inputs.changed-files != ''
        uses: ./.github/actions/clangd-tidy
        with:
          changed-files: ${{ inputs.changed-files }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: linux-editor-mono
        continue-on-error: true

      - name: Generate C# glue
        run: |
          ./bin/godot.linuxbsd.editor.x86_64.mono --headless --generate-mono-glue ./modules/mono/glue

      - name: Build .NET solutions
        run: |
          dotnet --info
          ./modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=linuxbsd --werror

      - name: Prepare artifact
        run: |
          rm -rf ./bin/build_deps
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: linux-editor-mono

      - name: Unit tests
        run: |
          ./bin/godot.linuxbsd.editor.x86_64.mono --version
          ./bin/godot.linuxbsd.editor.x86_64.mono --headless --test --force-colors

      - name: .NET source generators tests
        run: |
          dotnet test modules/mono/editor/Godot.NET.Sdk/Godot.SourceGenerators.Tests

      - name: Crete C# agent-runner tests
        run: |
          dotnet run --project tests/csharp/agent_runner_test/agent_runner_test.csproj --configuration Release

      - name: Crete dock/transport/status E2E
        shell: bash
        run: |
          rm -rf /tmp/crete-e2e && mkdir -p /tmp/crete-e2e
          cat > /tmp/crete-e2e/project.godot <<'EOF'
          config_version=5

          [application]

          config/name="CreteE2E"
          run/main_scene="res://main.tscn"
          EOF
          cat > /tmp/crete-e2e/Player.cs <<'EOF'
          using Godot;

          public partial class Player : CharacterBody2D
          {
          }
          EOF
          cat > /tmp/crete-e2e/main.tscn <<'EOF'
          [gd_scene load_steps=3 format=3]

          [ext_resource type="Script" path="res://Player.cs" id="1"]

          [node name="Level01" type="Node2D"]

          [node name="Player" type="CharacterBody2D" parent="." unique_name_in_owner=true]
          metadata/_tags = PackedStringArray("player", "controllable", "save-me")
          script = ExtResource("1")

          [node name="HUD" type="CanvasLayer" parent="."]

          [node name="PlayButton" type="Button" parent="HUD"]

          [connection signal="pressed" from="HUD/PlayButton" to="." method="_on_play_button_pressed"]
          EOF
          ./bin/godot.linuxbsd.editor.x86_64.mono --headless --path /tmp/crete-e2e --quit-after 30 -- --crete-e2e-docks > /tmp/crete-e2e.log 2>&1
          grep -q "e2e DONE" /tmp/crete-e2e.log
          grep -q "dock_9=\[FileSystem,Output,GitHub,Agents,Debugger,Animation,Shader Editor,Audio,MSBuild,Publish\]" /tmp/crete-e2e.log
          grep -q "signals2=\[Signals (1)\]" /tmp/crete-e2e.log
          grep -q "lock_action=locked" /tmp/crete-e2e.log
          grep -q "banner=yes" /tmp/crete-e2e.log
          grep -q "thumbs=on" /tmp/crete-e2e.log
          grep -q "hscroll=off" /tmp/crete-e2e.log
          grep -q "import=landed" /tmp/crete-e2e.log

  build-linux-templates:
    if: inputs.templates
    runs-on: ubuntu-22.04
    name: Template w/ Mono (Crete, target=${{ matrix.target }})
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: template_release
            cache-name: linux-template-mono
            bin: ./bin/godot.linuxbsd.template_release.x86_64.mono
          - target: template_debug
            cache-name: linux-template-mono-debug
            bin: ./bin/godot.linuxbsd.template_debug.x86_64.mono
    env:
      CRETE_FLAGS: >-
        module_mono_enabled=yes
        module_gdscript_enabled=no
        module_openxr_enabled=no
        tests=yes
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Restore Godot build cache
        uses: ./.github/actions/godot-cache-restore
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Setup Python and SCons
        uses: ./.github/actions/godot-deps

      - name: Steamworks SDK (optional)
        id: steam
        shell: bash
        env:
          STEAMWORKS_SDK_URL: ${{ secrets.STEAMWORKS_SDK_URL }}
        run: |
          if [ -n "$STEAMWORKS_SDK_URL" ]; then
            echo "Downloading Steamworks SDK..."
            curl -fsSL "$STEAMWORKS_SDK_URL" -o /tmp/steamworks_sdk.zip
            rm -rf /tmp/steamworks_sdk && mkdir -p /tmp/steamworks_sdk
            unzip -q /tmp/steamworks_sdk.zip -d /tmp/steamworks_sdk
            rm -rf modules/godotsteam/sdk && mkdir -p modules/godotsteam/sdk
            if [ -d /tmp/steamworks_sdk/public ]; then
              mv /tmp/steamworks_sdk/* modules/godotsteam/sdk/
            else
              mv /tmp/steamworks_sdk/*/* modules/godotsteam/sdk/
            fi
            ls modules/godotsteam/sdk/
            echo "steam-flags=module_godotsteam_enabled=yes module_crete_steam_stub_enabled=no" >> "$GITHUB_OUTPUT"
          else
            echo "No STEAMWORKS_SDK_URL secret; building with the Crete Steam stub."
            echo "steam-flags=module_godotsteam_enabled=no module_crete_steam_stub_enabled=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Compilation
        uses: ./.github/actions/godot-build
        with:
          scons-flags: ${{ env.SCONS_FLAGS }} ${{ env.CRETE_FLAGS }} ${{ steps.steam.outputs.steam-flags }}
          platform: linuxbsd
          target: ${{ matrix.target }}

      - name: Save Godot build cache
        uses: ./.github/actions/godot-cache-save
        with:
          cache-name: ${{ matrix.cache-name }}
        continue-on-error: true

      - name: Prepare artifact
        run: |
          rm -rf ./bin/build_deps
          strip bin/godot.*
          chmod +x bin/godot.*

      - name: Upload artifact
        uses: ./.github/actions/upload-artifact
        with:
          name: ${{ matrix.cache-name }}

      - name: Smoke test
        run: |
          ${{ matrix.bin }} --version
